[project]
name = "missingno-agents"
version = "0.1.0"
description = "Neural networks and learning code for the agents."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "torch>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/missingno_agents"]
