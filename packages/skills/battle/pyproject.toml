[project]
name = "missingno-battle"
version = "0.1.0"
description = "Abilità di lotta: baseline euristiche, poi modelli addestrati."
requires-python = ">=3.12"
dependencies = ["missingno-core", "missingno-envs", "poke-env>=0.8"]

[tool.uv.sources]
missingno-core = { workspace = true }
missingno-envs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/missingno_battle"]
