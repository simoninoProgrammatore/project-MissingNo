[project]
name = "missingno-envs"
version = "0.1.0"
description = "Ambienti: Pokémon Showdown (lotte) e, più avanti, PyBoy (gioco di ruolo)."
requires-python = ">=3.12"
dependencies = ["missingno-core", "poke-env>=0.8"]

[tool.uv.sources]
missingno-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/missingno_envs"]
