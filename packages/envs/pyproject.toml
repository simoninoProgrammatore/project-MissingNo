[project]
name = "missingno-envs"
version = "0.1.0"
description = "Gymnasium environments: Pokémon games running in an emulator, observed from the screen."
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0",
    "missingno-core",
    "missingno-games",
    "numpy>=2.0",
    "pyboy>=2.6",
    "tensorboard>=2.21.0",
]

[tool.uv.sources]
missingno-core = { workspace = true }
missingno-games = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/missingno_envs"]
