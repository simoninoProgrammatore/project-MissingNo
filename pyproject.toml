[project]
name = "missingno"
version = "0.1.0"
description = "An end-to-end agent that learns to play Pokémon games from the screen, from scratch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "missingno-core",
    "missingno-games",
    "missingno-envs",
    "missingno-agents",
    "pillow>=10",  # GIFs of the agent playing (scripts/watch.py)
    "imageio>=2.30",  # videos of replays (scripts/replay.py)
    "imageio-ffmpeg>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pre-commit>=4",
]

[tool.uv.workspace]
members = ["packages/core", "packages/games", "packages/envs", "packages/agents"]

[tool.uv.sources]
missingno-core = { workspace = true }
missingno-games = { workspace = true }
missingno-envs = { workspace = true }
missingno-agents = { workspace = true }

[tool.ruff]
extend-exclude = ["notebooks"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long lines are left to the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
